[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "pbl_config"
version = "0.1.0"
description = "Pydantic schemas and path-based loaders for the ForzaETH car configs: car model, Pacejka tyre, steering LUT, trailing. No ROS."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=5.3",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["pbl_config*"]

[tool.autopep8]
max_line_length = 120
